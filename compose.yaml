services:
  postgres:
    image: postgres:16
    container_name: insultbot-db
    environment:
      POSTGRES_DB: insultbot
      POSTGRES_USER: insultbot
      POSTGRES_PASSWORD: insultbot
    ports:
      - "5432:5432"
    volumes:
      - insultbot-data:/var/lib/postgresql/data

volumes:
  insultbot-data:
