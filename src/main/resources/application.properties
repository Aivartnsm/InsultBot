spring.application.name=AITestMoodul

# application.properties (Spring AI 2.x)
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.response-mime-type=application/json

# GIPHY (reaction GIFs, rating filters out explicit content)
giphy.api-key=${GIPHY_SDK_KEY:}
giphy.rating=pg

# PostgreSQL (started via compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/insultbot
spring.datasource.username=${DB_USERNAME:insultbot}
spring.datasource.password=${DB_PASSWORD:insultbot}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true